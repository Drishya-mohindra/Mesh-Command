# dnsmasq config — hands out local IPs to joining devices and redirects
# all DNS lookups back to the Pi, which is what makes the captive portal work.
# Copy to /etc/dnsmasq.conf on the Raspberry Pi

interface=wlan0
dhcp-range=192.168.4.2,192.168.4.20,255.255.255.0,24h

# Redirect every DNS query to the Pi's own IP.
# Phones will then hit the captive-portal-detection routes in server/index.js,
# which redirect to the app itself.
address=/#/192.168.4.1
