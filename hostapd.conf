# hostapd config TEMPLATE — turns wlan0 into a standalone WiFi access point.
#
# This file is a TEMPLATE: setup-ap.sh fills in the ssid/channel values below and
# writes the rendered result to /etc/hostapd/hostapd.conf. Don't copy this file
# there by hand unless you substitute those two values yourself.
#
#   ssid     <- $AP_SSID,      default "MeshCommandPost-<random 3 digits>"
#   channel  <- $WIFI_CHANNEL, default = least-congested of 1/6/11 (pick-channel.sh)

interface=wlan0
driver=nl80211

# SSID is templated so two teams building AP-based projects at the same event
# don't both broadcast "MeshCommandPost" and confuse judges walking between booths.
# Override with:  AP_SSID="MeshCommandPost-RedTeam" sudo -E bash setup/setup-ap.sh
ssid=__SSID__

hw_mode=g

# Channel is chosen by a pre-flight scan rather than hardcoded to 6, which is
# usually the most congested channel in a crowded venue. See setup/pick-channel.sh.
channel=__CHANNEL__

wmm_enabled=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0

# ---------------------------------------------------------------------------
# SECURITY: this network is OPEN by default.
#
# That is a deliberate demo-speed tradeoff — in a crisis (and on a demo floor)
# anyone should be able to join in seconds without being handed a passphrase.
# The flip side: anyone in radio range can join and post to the board, and
# traffic is unencrypted over the air.
#
# For any real-world deployment, uncomment the WPA2 block below and set a real
# passphrase. Then hand out access with a WiFi QR code (see README) so scanning
# one code both joins the network AND opens the board — the passphrase stops
# being a barrier, which is the only reason to leave it open in the first place.
# ---------------------------------------------------------------------------
# wpa=2
# wpa_passphrase=changeme123
# wpa_key_mgmt=WPA-PSK
# rsn_pairwise=CCMP
